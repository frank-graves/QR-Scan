# Detekt config: solo gate de dead-code de miembros privados.
# El resto de rulesets queda desactivado para evitar ruido de estilo.
build:
  maxIssues: 0

comments:
  active: false
complexity:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false

style:
  active: false
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedParameter:
    active: false
