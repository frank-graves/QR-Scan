name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # detekt solo valida UnusedPrivate*; ver config/detekt/detekt.yml
      - run: ./gradlew assembleDebug testDebugUnitTest detekt --stacktrace

  connected-tests:
    # Esqueleto no bloqueante. Activar cuando exista un runner con KVM.
    # Pasos de referencia (no incluidos para no consumir minutos sin emulador):
    #   - uses: reactivecircus/android-emulator-runner@v2
    #     with:
    #       api-level: 34
    #       arch: x86_64
    #       script: ./gradlew connectedDebugAndroidTest
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "connectedDebugAndroidTest está desactivado hasta disponer de runner con KVM"
